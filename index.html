document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

elee enemmän', 1, 150]], bonus: ['trivia', 'event', 'poll'] },\n  2: { title: '2. erä', picks: [['p2goals', 'Maalit tässä erässä', 2, 100], ['p2shots', 'Eniten laukauksia', 1, 150], ['p2goalie', 'Rantasen torjunnat', 1, 100], ['p2speed', 'Kovin laukaus · 157 km/h', 'speed', 200]], bonus: ['trivia2', 'poll2'] },\n  3: { title: '3. erä', picks: [['p3goals', 'Maalit tässä erässä', 1, 100], ['p3saves', 'Rantasen torjunnat', 1, 100], ['p3reg', 'Varsinaisella peliajalla?', 1, 150], ['p3empty', 'Maali tyhjään maaliin', 1, 100]], bonus: ['trivia3'] },\n  4: { title: 'Jatkoaika', picks: [['ot', 'Kuka voittaa?', 0, 150]], bonus: ['potg'] },\n};\nconst NOWL = { 'Ylivoimamaali': 'Ylivoimat', 'Ensimmäinen maali': 'Painaa nyt', 'Maalit tässä erässä': 'Maaleja', 'Eniten laukauksia': 'Eniten nyt', 'Rantasen torjunnat': 'Torjunnat', 'Erän kovin laukaus': 'Kovin nyt', 'Varsinaisella peliajalla?': 'Tilanne', 'Maali tyhjään maaliin': 'Tyhjiin maaleihin', 'Jatkoaika': 'Laukaukset' };\nconst PTS = { 'Ensimmäinen maali': 100, 'Ylivoimamaali': 150, 'Maalit tässä erässä': 100, 'Eniten laukauksia': 150, 'Rantasen torjunnat': 100, 'Varsinaisella peliajalla?': 150, 'Maali tyhjään maaliin': 100, 'Jatkoaika': 150 };\nconst detailOf = c => {\n  let now = '–', mine = c.a || '–', note = 'Ratkeaa erän päätyttyä.';\n  if (c.gauge) { now = c.gauge.now + (c.gauge.min === 100 ? ' km/h' : ''); mine = c.gauge.guessText || (c.gauge.guess + ' km/h'); }\n  if (c.duel && c.duel.static) { now = c.duel.av + ' – ' + c.duel.bv; note = c.duel.an + ' vs. ' + c.duel.bn + '. ' + note; }\n  if (c.duel && !c.duel.static) { const lead = parseFloat(c.duel.av.replace(',', '.')) >= parseFloat(c.duel.bv.replace(',', '.')) ? c.duel.an : c.duel.bn; now = c.stText === 'Tasan' ? 'Tasan' : lead; mine = c.duel.mine === 'a' ? c.duel.an : c.duel.bn; note = 'Luisteltu matka tässä erässä. Päivittyy noin minuutin välein lähetyksesi tahdissa.'; }\n  if (c.tug) { now = c.tug.pct < 50 ? c.tug.b : c.tug.a; mine = c.a || '–'; note = 'Mittari näyttää, kumpi joukkue on nyt lähempänä maalia. Ratkeaa ensimmäiseen maaliin.'; }\n  if (c.result) { now = c.result.replace('Maalin teki ', ''); note = 'Ratkesi maalin hetkellä.'; }\n  if (c.bars) { const top = c.bars.reduce((a, b) => b.v > a.v ? b : a); now = top.l; mine = (c.bars.find(b => b.mine) || {}).l || mine; note = 'Laukaukset lasketaan ketjun kaikille pelaajille. ' + note; }\n  const pts = c.q === 'Erän kovin laukaus' ? 'Oikea vastaus: 200 p, mitä lähempänä sitä enemmän' : 'Oikea vastaus: ' + (PTS[c.q] || (c.duel && !c.duel.static ? 150 : 100)) + ' p';\n  return { st: c.st, stText: c.stText, nowL: NOWL[c.q] || (c.duel && !c.duel.static ? 'Johdossa nyt' : 'Tilanne nyt'), now, mine, ptsText: pts, note, bars: c.bars, tug: c.tug, duel: c.duel && !c.duel.static ? c.duel : null };\n};\nconst fmt = n => String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' ');\nconst STX = { on: 'Matkalla', open: 'Auki', miss: 'Ohi', hit: 'Oikein', wrong: 'Väärin', lead: 'Johdossa', behind: 'Perässä' };\nconst stt = k => ({ st: k, stText: STX[k] });\nconst countSt = (k, n, done) => k === 2 ? (n >= 2 ? stt(done ? 'hit' : 'on') : stt('open')) : n > k ? stt('miss') : n === k ? stt('on') : stt('open');\nconst savesSt = (k, n) => k === 0 ? (n >= 10 ? stt('hit') : stt('open')) : (n >= 10 ? stt('miss') : stt('on'));\nconst SEASON = [{ rank: '1', name: 'AuraTorjuja 3', pts: '8 420' }, { rank: '2', name: 'KupittaaPakki 14', pts: '8 115' }, { rank: '3', name: 'ValkoTaistelija 8', pts: '7 960' }, { gap: true }, { rank: '211', name: 'ItäTykki 52', pts: '3 160' }, { rank: '212', name: 'Sinä', pts: '3 150', you: true }, { rank: '213', name: 'MustaPakki 30', pts: '3 140' }];\nconst BOARD2 = [{ rank: '1', name: 'KupittaaPakki 14', pts: '820' }, { rank: '2', name: 'AuraTorjuja 3', pts: '790' }, { rank: '3', name: 'MustaPuurtaja 41', pts: '760' }, { gap: true }, { rank: '139', name: 'ItäTykki 52', pts: '640' }, { rank: '140', name: 'Sinä', pts: '625', move: '↑28', you: true }, { rank: '141', name: 'AuraPuurtaja 19', pts: '620' }];\nconst FINAL = [{ rank: '1', name: 'KupittaaPakki 14', pts: '1 640' }, { rank: '2', name: 'AuraTorjuja 3', pts: '1 585' }, { rank: '3', name: 'MustaPuurtaja 41', pts: '1 540' }, { rank: '4', name: 'ValkoTaistelija 8', pts: '1 500' }, { gap: true }, { rank: '60', name: 'ItäTykki 52', pts: '1 135' }, { rank: '61', name: 'Sinä', pts: '1 130', move: '↑79', you: true }, { rank: '62', name: 'AuraPuurtaja 19', pts: '1 120' }];\nconst INIT = { speed: 150, id: 'welcome', ret: null, sheet: null, sel: {}, ans: {}, name: [0, 0], toggles: [true, false], tab: 0 };\nclass Component extends DCLogic {\n  state = { ...INIT, scale: 1 };\n  componentDidMount() {\n    this.fit = () => { const h = window.innerHeight, w = window.innerWidth; if (h < 200) return; this.setState({ mobile: w < 600 && ('ontouchstart' in window || navigator.maxTouchPoints > 0), scale: Math.max(0.5, Math.min(1, (h - 48) / 874)) }); };\n    window.addEventListener('resize', this.fit); this.fit();\n    this.ro = new ResizeObserver(() => this.fit()); this.ro.observe(document.documentElement);\n    this.poll = setInterval(() => { if (window.HOCKEY) { clearInterval(this.poll); this.forceUpdate(); } }, 50);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.fit); this.ro && this.ro.disconnect(); clearInterval(this.poll); }\n  go(id, extra) { this.setState({ id, sheet: null, tab: 0, ...(extra || {}) }); }\n  screens() {\n    if (this._x) return this._x;\n    const D = window.HOCKEY, S = D.SCREENS, { PIPS, P, H, slot } = D;\n    const hd = (ga, gb, ...p) => ({ ga, gb, pips: PIPS(...p) });\n    const HH = { p2a: hd(0, 1, ['done'], ['now', 'live']), p2b: hd(1, 2, ['done'], ['now', 'live']), end2: hd(1, 2, ['done'], ['now', 'ratkesi']), p3a: hd(1, 2, ['done'], ['done'], ['now', 'live']), p3b: hd(2, 2, ['done'], ['done'], ['now', 'live']), end3: hd(2, 2, ['done'], ['done'], ['now', 'ratkesi']), otLive: hd(2, 2, ['done'], ['done'], ['done'], ['now', 'live']) };\n    const S2 = '2. erän ennusteet', S3 = '3. erän ennusteet', P100 = 'Oikea ennuste: 100 pistettä';\n    const goals = (hdr, sl, def) => ({ kind: 'pick', hdr, slot: sl, pill: 'Otteluennuste', q: 'Montako maalia tässä erässä?', variant: 'tile', cols: 3, opts: [{ text: '0' }, { text: '1' }, { text: '2+' }].map((o, i) => i === def ? { ...o, state: 'selected' } : o), hint: P100, cta: { text: 'Seuraava' } });\n    const review = (hdr, title) => ({ kind: 'review', hdr, kicker: 'Lukittu', title, items: [], cta: { text: 'Valmis', v: 'done' }, cta2: 'Muuta ennustetta' });\n    const q = (hdr, pill, text, opts, extra) => ({ kind: 'q', hdr, pill, q: text, opts, cta2: 'Takaisin ennusteisiin', ...(extra || {}) });\n    this._x = {\n      ...S,\n      pick1: S.pick1, pick3: S.pick3, pick4: S.pick4,\n      p2goals: goals(H.int1, slot(S2, 1, 4), 2),\n      p2shots: { ...S.p2shots, slot: slot(S2, 2, 4) },\n      p2goalie: { ...S.p2goalie, slot: slot(S2, 3, 4) },\n      p2speed: { ...S.p2speed, slot: slot(S2, 4, 4) },\n      review2: review(H.int1, '2. erän ennusteet'),\n      p2live1: { kind: 'tally', hdr: HH.p2a, label: 'Ennusteesi', standing: { rank: '#168', t: 'Jos erä päättyisi nyt: noin #160' }, next: 'Seuraavat ennusteet erätauolla' },\n      p2live2: { kind: 'tally', hdr: HH.p2b, label: 'Ennusteesi', standing: { rank: '#168', t: 'Jos erä päättyisi nyt: noin #140' }, next: 'Seuraavat ennusteet erätauolla' },\n      trivia2: q(HH.p2a, 'TPS-visa · +20', 'Monesko kausi Rantasella on TPS:ssä?', [{ text: '1.' }, { text: '2.' }, { text: '3.' }, { text: '4.' }], { variant: 'tile', cols: 2, hint: 'Ei aikarajaa' }),\n      poll2: q(HH.p2a, 'Kysely · +5', 'Mikä on ollut illan paras hetki?', [{ text: 'Lehtosen YV-maali' }, { text: 'Rantasen torjunnat' }, { text: 'Kannattajien laulu' }], { cta2: 'Myöhemmin' }),\n      board2: { kind: 'board', hdr: HH.end2, title: 'Illan tulostaulu', tabs: [{ t: 'Tämä ilta', on: true }, { t: 'Kausi' }], board: BOARD2, cta: { text: '3. erän ennusteet' } },\n      p3goals: goals(H.int2, slot(S3, 1, 4), 1),\n      p3saves: { ...S.p2goalie, hdr: H.int2, slot: slot(S3, 2, 4), opts: S.p2goalie.opts.map((o, i) => i === 0 ? { ...o, state: 'selected' } : o), cta: { text: 'Seuraava' } },\n      p3reg: { ...S.p3pick, slot: slot(S3, 3, 4) },\n      p3empty: { kind: 'pick', hdr: H.int2, slot: slot(S3, 4, 4), pill: 'Otteluennuste', q: 'Tuleeko erässä maali tyhjään maaliin?', variant: 'tile', cols: 2, opts: [{ text: 'Kyllä' }, { text: 'Ei', state: 'selected' }], hint: P100, cta: { text: 'Lukitse ennusteet' } },\n      review3: review(H.int2, '3. erän ennusteet'),\n      p3live1: { kind: 'tally', hdr: HH.p3a, label: 'Ennusteesi', standing: { rank: '#140', t: 'Jos erä päättyisi nyt: noin #130' }, next: 'Pisteet erän päätyttyä' },\n      p3live2: { kind: 'tally', hdr: HH.p3b, label: 'Ennusteesi', standing: { rank: '#140', t: 'Jos erä päättyisi nyt: noin #95' }, bonusClosed: 'Loppuminuutit: katse jäähän!', next: 'Jos peli jatkuu, jatkoajan ennuste ennen aloitusta' },\n      trivia3: q(HH.p3a, 'TPS-visa · +20', 'Montako maalia Virtanen teki tällä kaudella ennen tätä iltaa?', [{ text: '2' }, { text: '4' }, { text: '6' }, { text: '8' }], { variant: 'tile', cols: 2, hint: 'Ei aikarajaa' }),\n      ot: { ...S.ot, cta: { text: 'Lukitse ennuste' } },\n      finalBoard: { kind: 'board', hdr: H.fin, title: 'Illan tulostaulu', tabs: [{ t: 'Tämä ilta', on: true }, { t: 'Kausi' }], board: FINAL, note: 'Lopullinen · 1 930 pelaajaa', cta: { text: 'Takaisin' } },\n      otLive: { kind: 'tally', hdr: HH.otLive, label: 'Ennusteesi', cards: [], standing: { rank: '#61', t: 'Jos peli päättyisi nyt' }, next: 'Pisteet ottelun päätyttyä' },\n      poll: { ...S.poll, opts: S.poll.opts.map(o => ({ text: o.text, num: o.num, head: o.head })), result: '', cta: null, cta2: 'Myöhemmin' },\n      HH,\n    };\n    return this._x;\n  }\n  base(id) { return this.screens()[id]; }\n  sel(id) { const v = this.state.sel[id]; if (v != null) return v; const sp = this.base(id); const i = ((sp && sp.opts) || []).findIndex(o => o.state === 'selected'); return i < 0 ? null : i; }\n  pickText(id) { if (id === 'p2speed') return this.state.speed + ' km/h'; const k = this.sel(id), sp = this.base(id); return k == null ? '–' : sp.opts[k].text; }\n  handle() { const S = window.HOCKEY.SCREENS.name; return S.w1[this.state.name[0]].t + S.w2[this.state.name[1]].t + ' 27'; }\n  queue(id) { return (TRAY[id] || []).filter(k => this.state.ans[k] == null && !this.state.skip?.[k]); }\n  res(n) {\n    const p = PER[n], st = this.state; let hits = 0, sum = 0;\n    const rows = p.picks.map(([id, label, cor, pts]) => {\n      let hit, got, q = label;\n      if (cor === 'speed') { got = Math.max(0, 200 - 10 * Math.abs(st.speed - 157)); hit = got > 0; }\n      else { hit = this.sel(id) === cor; got = hit ? pts : 0; if (!hit) q = label + ' · oikein: ' + this.base(id).opts[cor].text; }\n      if (hit) hits++; sum += got;\n      return { hit, q, a: this.pickText(id), pts: got ? '+' + got : '0' };\n    });\n    const b = p.bonus.reduce((t, k) => t + (st.ans[k] == null ? 0 : QA[k] ? (st.ans[k] === QA[k].correct ? 20 : 0) : 5), 0);\n    return { title: p.title, big: `${hits}/${rows.length} oikein`, short: `${hits}/${rows.length}`, pts: '+' + sum, rows, bonusLine: 'Bonus', bonusPts: '+' + b, total: sum + b, all: hits === rows.length };\n  }\n  cards(id) {\n    const k = x => this.sel(x), t = x => this.pickText(x);\n    if (id === 'tally1' || id === 'tally2') {\n      const D = window.HOCKEY, src = D.SCREENS[id].cards, fg = k('pick1'), pp = k('pick3'), du = k('pick4') === 1 ? 'b' : 'a';\n      return src.map((c, j) => {\n        if (j === 0) return id === 'tally1' ? { ...c, a: t('pick1'), tug: { ...c.tug, mine: fg === 0 ? 'a' : fg === 2 ? 'b' : null } } : { ...c, a: t('pick1'), ...stt(fg === 2 ? 'hit' : 'wrong') };\n        if (j === 1) return { ...c, a: t('pick3'), ...(id === 'tally2' ? stt(pp === 0 ? 'hit' : 'wrong') : {}) };\n        return { ...c, duel: { ...c.duel, mine: du }, ...(id === 'tally2' ? stt(du === 'a' ? 'lead' : 'behind') : {}) };\n      });\n    }\n    if (id === 'p2live1' || id === 'p2live2') {\n      const late = id === 'p2live2', g = late ? 2 : 0, sh = late ? [5, 7, 3] : [1, 2, 0], sv = late ? 6 : 2, sp = late ? 141 : 128, line = k('p2shots'), gk = k('p2goalie');\n      const top = sh.indexOf(Math.max(...sh));\n      return [\n        { q: 'Maalit tässä erässä', a: t('p2goals'), ...countSt(k('p2goals'), g), gauge: { min: 0, max: 4, now: g, guess: k('p2goals'), guessText: t('p2goals'), lNow: 'Maaleja nyt' } },\n        { q: 'Eniten laukauksia', a: t('p2shots'), ...stt(line === top ? 'lead' : 'behind'), bars: sh.map((v, i) => ({ l: (i + 1) + '. ketju', v, mine: i === line })) },\n        { q: 'Rantasen torjunnat', a: t('p2goalie'), ...(gk == null ? stt('open') : savesSt(gk, sv)), gauge: { min: 0, max: 16, now: sv, guess: 9.5, guessText: t('p2goalie'), lNow: 'Torjunnat nyt' } },\n        { q: 'Erän kovin laukaus', a: t('p2speed'), ...stt('open'), gauge: { min: 100, max: 180, now: sp, guess: this.state.speed } },\n      ];\n    }\n    if (id === 'p3live1' || id === 'p3live2') {\n      const late = id === 'p3live2', g = late ? 1 : 0, sv = late ? 7 : 3, reg = k('p3reg'), em = k('p3empty');\n      return [\n        { q: 'Maalit tässä erässä', a: t('p3goals'), ...countSt(k('p3goals'), g), gauge: { min: 0, max: 4, now: g, guess: k('p3goals'), guessText: t('p3goals'), lNow: 'Maaleja nyt' } },\n        { q: 'Rantasen torjunnat', a: t('p3saves'), ...savesSt(k('p3saves'), sv), gauge: { min: 0, max: 16, now: sv, guess: 9.5, guessText: t('p3saves'), lNow: 'Torjunnat nyt' } },\n        { q: 'Varsinaisella peliajalla?', a: t('p3reg'), ...stt(late && reg === 1 ? 'on' : 'open'), duel: { an: 'HIFK', av: late ? '2' : '1', bn: 'TPS', bv: '2', pct: late ? 50 : 33, static: true } },\n        { q: 'Maali tyhjään maaliin', a: t('p3empty'), ...stt(em === 1 ? 'on' : 'open'), gauge: { min: 0, max: 2, now: 0, guess: 1, guessText: t('p3empty'), lNow: 'Tyhjiin maaleihin' } },\n      ];\n    }\n    if (id === 'otLive') return [{ q: 'Jatkoaika', a: t('ot'), ...stt('open'), duel: { an: 'HIFK laukaukset', av: '3', bn: 'TPS laukaukset', bv: '5', pct: 38, static: true } }];\n    return null;\n  }\n  spec() {\n    const st = this.state, id = st.id, X = this.screens();\n    let s = X[id] || {};\n    if (s.kind === 'pick' && s.opts) {\n      const k = this.sel(id);\n      s = { ...s, opts: s.opts.map((o, j) => ({ ...o, state: j === k ? 'selected' : 'idle' })) };\n      if (s.cta && s.cta.v === 'disabled' && k != null) s = { ...s, cta: { text: 'Seuraava' } };\n    }\n    if (id === 'p2speed') s = { ...s, slider: { ...s.slider, v: st.speed } };\n    if (id === 'review') s = { ...s, items: [['Ensimmäinen maali', 'pick1'], ['Ylivoimamaali', 'pick3'], ['Luistelee enemmän', 'pick4']].map(([q, p]) => ({ q, a: this.pickText(p) })) };\n    if (id === 'review2') s = { ...s, items: [['Maalit tässä erässä', 'p2goals'], ['Eniten laukauksia', 'p2shots'], ['Rantasen torjunnat', 'p2goalie'], ['Erän kovin laukaus', 'p2speed']].map(([q, p]) => ({ q, a: this.pickText(p) })) };\n    if (id === 'review3') s = { ...s, items: [['Maalit tässä erässä', 'p3goals'], ['Rantasen torjunnat', 'p3saves'], ['Varsinaisella peliajalla?', 'p3reg'], ['Maali tyhjään maaliin', 'p3empty']].map(([q, p]) => ({ q, a: this.pickText(p) })) };\n    const cs = this.cards(id); if (cs) s = { ...s, cards: cs };\n    if (TRAY[id]) { const q = this.queue(id); s = { ...s, tray: q.length ? { t: q.length === 1 ? BONUS[q[0]] : `${q.length} bonuskysymystä`, isNew: q[0] === 'event' } : null }; }\n    const RV = { reveal1: [1, window.HOCKEY.H.end1, '1. erä ratkesi', 'Tulostaulu'], reveal2: [2, X.HH.end2, '2. erä ratkesi', 'Tulostaulu'], reveal3: [3, X.HH.end3, '3. erä ratkesi · tasan 2–2', 'Jatkoajan ennuste'] };\n    if (RV[id]) { const [n, hdr, kicker, cta] = RV[id], r = this.res(n); s = { kind: 'reveal', hdr, kicker, big: r.big, pts: r.pts, rows: r.rows, bonusLine: r.bonusLine, bonusPts: r.bonusPts, cta: { text: cta } }; }\n    if (id === 'summary' || id === 'end') {\n      const rs = [1, 2, 3, 4].map(n => this.res(n)), tot = rs.reduce((a, r) => a + r.total, 0);\n      s = { ...s, standing: { rank: '#61', t: 'Koko tulostaulu' }, handle: this.handle(), pts: fmt(tot), periods: rs.map((r, i) => ({ l: ['E1', 'E2', 'E3', 'JA'][i], v: i === 3 ? (r.all ? '✓' : '✕') : r.short })) };\n      if (id === 'end') s = { ...s, cta: { text: 'Aloita alusta' }, cta2: '' };\n    }\n    if (id === 'summary' || id === 'end') s = { ...window.HOCKEY.SCREENS.summary, ...s };\n    if (id === 'welcome') s = { ...s, handle: this.handle() };\n    if (id === 'name') { const [a, b] = st.name; s = { ...s, w1: s.w1.map((w, i) => ({ t: w.t, on: i === a })), w2: s.w2.map((w, i) => ({ t: w.t, on: i === b })), preview: this.handle() }; }\n    if (id === 'ask') s = { ...s, toggles: s.toggles.map((t, i) => ({ ...t, on: st.toggles[i] })) };\n    if (id === 'finalBoard') s = { ...s, board: FINAL.map(r => r.you ? { ...r, name: this.handle() } : r) };\n    if ((id === 'board' || id === 'board2' || id === 'finalBoard') && st.tab === 1) s = { ...s, title: 'Kauden tulostaulu', tabs: s.tabs.map((t, i) => ({ t: t.t, on: i === 1 })), board: SEASON };\n    if (QA[id] && st.ans[id] != null) {\n      const a = st.ans[id], qa = QA[id], right = a === qa.correct;\n      s = { ...s, opts: s.opts.map((o, j) => ({ ...o, state: j === qa.correct ? 'correct' : j === a ? 'wrong' : 'dim', tag: j === qa.correct && right ? '+20' : '' })), hint: '', result: right ? qa.ok : qa.no, cta: { text: 'Takaisin ennusteisiin' }, cta2: '' };\n    }\n    if (VOTE[id] && st.ans[id] != null) {\n      const a = st.ans[id], p = VOTE[id];\n      s = { ...s, opts: s.opts.map((o, j) => ({ ...o, state: j === a ? 'voted' : 'idle', pct: p[j], pts: p[j] + ' %' })), hint: '', result: 'Kiitos äänestä! +5 pistettä', cta: id === 'potg' ? null : { text: 'Takaisin ennusteisiin' }, cta2: id === 'potg' ? 'Valmis' : '' };\n    }\n    if (QSCREENS.includes(id) && st.ret && X[st.ret]) s = { ...s, hdr: X[st.ret].hdr };\n    if (st.sheet) s = { ...s, sheet: st.sheet };\n    return s;\n  }\n  renderVals() {\n    const st = this.state, sc = st.scale;\n    const frame = { phoneW: 402 * sc + 'px', phoneH: 874 * sc + 'px', phoneT: `scale(${sc})` };\n    if (!window.HOCKEY) return { ...frame, mobile: false, desktop: true, s: null, chapters: [], hasEvent: false, noEvent: true, hint: 'Loading…' };\n    const D = window.HOCKEY, id = st.id, ch = CH[id] ?? 0, ev = !st.sheet && EVENTS[id];\n    const back = () => this.go(st.ret || 'tally1', { ret: null });\n    const s = this.spec();\n    return {\n      ...frame, s, mobile: !!st.mobile, desktop: !st.mobile, botPad: 'calc(env(safe-area-inset-bottom, 0px) + 16px)',\n      onPick: j => {\n        const sp = this.base(id);\n        if (sp.kind === 'pick') return this.setState({ sel: { ...st.sel, [id]: j } });\n        if ((QA[id] || VOTE[id]) && st.ans[id] == null) this.setState({ ans: { ...st.ans, [id]: j } });\n      },\n      onNext: () => {\n        if (id === 'end') return this.setState({ ...INIT });\n        if (id === 'finalBoard') return this.go(st.ret || 'summary', { ret: null });\n        if (QSCREENS.includes(id)) return back();\n        if (NEXT[id]) this.go(NEXT[id]);\n      },\n      onCta2: () => {\n        if (FIRST[id]) return this.go(FIRST[id]);\n        if (id === 'ask') return this.go('p2goals');\n        if (id === 'potg') return this.go('end');\n        if (QSCREENS.includes(id)) return back();\n        if (id === 'summary' || id === 'end') return this.setState({ sheet: { title: 'Jaa iltasi', note: `${this.handle()} · ${s.pts} pistettä · sija #61 · TPS voitti jatkoajalla 2–3. Kuva on valmis jaettavaksi.` } });\n        if (NEXT[id]) this.go(NEXT[id]);\n      },\n      onPip: l => { const n = { E1: 1, E2: 2, E3: 3, JA: 4 }[l]; if (n) this.setState({ sheet: this.res(n) }); },\n      onClose: () => this.setState({ sheet: null }),\n      onStanding: () => (id === 'summary' || id === 'end') ? this.go('finalBoard', { ret: id }) : this.setState({ sheet: id === 'tally1' ? { title: 'Tulostaulu', note: 'Ensimmäiset sijoitukset lasketaan 1. erän päätyttyä.' } : { title: 'Tulostaulu', note: 'Sijoitukset lasketaan erän päätyttyä. Jos erä päättyisi nyt:', board: id === 'tally2' ? D.BOARDP1 : id.startsWith('p2') ? D.SCREENS.board.board : BOARD2 } }),\n      onTray: () => { const q = this.queue(id); if (q.length) this.go(q[0], { ret: id }); },\n      onCard: i => { const c = (s.cards || [])[i]; if (c && !c.split) this.setState({ sheet: { title: c.q, detail: detailOf(c) } }); },\n      onChangeName: () => this.go('name'),\n      onSlide: v => this.setState({ speed: v }),\n      onWord: (list, i) => this.setState({ name: list === 1 ? [i, st.name[1]] : [st.name[0], i] }),\n      onToggle: i => this.setState({ toggles: st.toggles.map((v, j) => j === i ? !v : v) }),\n      onTab: i => this.setState({ tab: i }),\n      hasEvent: !!ev, noEvent: !ev, eventLabel: ev ? ev[0] : '',\n      hint: st.sheet ? 'Close the sheet (Sulje or tap outside) to carry on.' : TRAY[id] === undefined && EVENTS[id] === undefined ? 'Tap through the phone. Finished period pips open that period’s result; every pick card opens its live detail.' : 'Back on the live screen, the game can move on.',\n      fireEvent: () => ev && this.go(ev[1]),\n      chapters: CHAPTERS.map((t, i) => ({ n: i + 1, t, bg: i === ch ? '#ffd400' : 'rgba(255,255,255,.05)', fg: i === ch ? '#16130a' : '#dbe4ec', go: () => this.go(CHLIST[i][0], { ret: null, sel: i >= 2 ? { pick1: 2, p2goalie: 0, ...st.sel } : st.sel }) })),\n      restart: () => this.setState({ ...INIT }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
